
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121c">
  <title>NTL Launcher</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #10121c, #192d49);
      text-align: center;
      padding: 20px;
    }

    .launcher {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      background: #202638;
      border: 1px solid #37445f;
      border-radius: 20px;
    }

    h1 {
      color: #55e6a5;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #c8d0e0;
      line-height: 1.6;
    }

    button {
      margin-top: 18px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #55e6a5;
      color: #10121c;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="launcher">
    <h1>NTL Launcher</h1>
    <p>Your Minecraft launcher project starts here.</p>
    <p>Simple. Fast. Built for mobile gamers.</p>
    <button onclick="alert('Welcome to NTL Launcher!')">
      Get Started
    </button>
  </main>
</body>
</html>
